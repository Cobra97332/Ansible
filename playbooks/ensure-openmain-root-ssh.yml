---
- name: OpenMain root SSH key access
  hosts: all
  become: true
  gather_facts: true

  vars:
    openmain_root_ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJc8VZvZ7o/8emKoGC7UXPiOMP8PSxch6P2rUGNio8Vi Stefan"

  tasks:
    - name: Install OpenSSH server on Debian/Ubuntu
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install OpenSSH server on RedHat-compatible systems
      ansible.builtin.package:
        name: openssh-server
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure root SSH directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure root authorized_keys exists
      ansible.builtin.file:
        path: /root/.ssh/authorized_keys
        state: touch
        owner: root
        group: root
        mode: "0600"

    - name: Install OpenMain public key for root
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ openmain_root_ssh_key }}"
        state: present
        create: true
        owner: root
        group: root
        mode: "0600"

    - name: Ensure sshd drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enforce root key-only SSH access
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-openmain-root-key.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
        enabled: true
